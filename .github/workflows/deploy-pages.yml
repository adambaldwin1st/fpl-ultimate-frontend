name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "fpl-ultimate/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fpl-ultimate/package-lock.json

      - name: Install dependencies
        working-directory: fpl-ultimate
        # npm ci refuses this lockfile: eslint pins ajv@6 while webpack's
        # schema-utils/ajv-keywords need ajv@8, resolved via nested (non-hoisted)
        # installs that npm ci's strict flat-consistency check rejects even
        # though the tree is genuinely valid. npm install handles it correctly.
        run: npm install

      - name: Build
        working-directory: fpl-ultimate
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fpl-ultimate/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
